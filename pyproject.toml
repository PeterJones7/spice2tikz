[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "spice2tikz"
description = "Convert SPICE netlists and LTspice schematics into CircuiTikZ LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "spice2tikz contributors" }]
keywords = ["spice", "ltspice", "circuitikz", "latex", "tikz", "schematic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/PeterJones7/spice2tikz"
Repository = "https://github.com/PeterJones7/spice2tikz"
Changelog = "https://github.com/PeterJones7/spice2tikz/blob/main/CHANGELOG.md"
Documentation = "https://github.com/PeterJones7/spice2tikz/tree/main/docs"
Issues = "https://github.com/PeterJones7/spice2tikz/issues"

[project.scripts]
spice2tikz = "spice2tikz.cli:main"

[tool.hatch.version]
path = "src/spice2tikz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spice2tikz"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "tools",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
]
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "D105",  # magic method docstrings
    "D107",  # __init__ docstring (documented on the class)
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
