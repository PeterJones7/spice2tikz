name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .
      - name: mypy (strict)
        run: mypy

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest

  compile:
    name: compile goldens (TeX Live)
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-venv
      - name: Install package with dev extras
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install -e ".[dev]"
      - name: Check the toolchain is really present
        run: latexmk --version
      - name: Compile every standalone golden
        run: /tmp/venv/bin/python -m pytest tests/test_compile.py -v
      # Only the .tex is compared: PNG bytes depend on the Ghostscript and
      # TeX Live versions, so they would differ on every image without the
      # drawing having changed.
      - name: Rebuild the example gallery and check the .tex has not drifted
        run: |
          apt-get install -y --no-install-recommends ghostscript
          PYTHON=/tmp/venv/bin/python bash examples/build.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- 'examples/*.tex'; then
            echo "examples/*.tex differs from what is committed:"
            git --no-pager diff -- 'examples/*.tex'
            exit 1
          fi
